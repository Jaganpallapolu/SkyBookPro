<template>

    <div class="passenger-card">

        <!-- Header -->

        <div class="card-header">

            <div class="header-left">

                <div class="avatar">

                    👤

                </div>

                <div>

                    <div class="card-title">

                        {cardTitle}

                    </div>

                    <div class="subtitle">

                        Passenger Information

                    </div>

                </div>

            </div>

            <span class="passenger-badge">

                {passenger.passengerType}

            </span>

        </div>

        <!-- Personal Information -->

        <div class="section">

            <div class="section-title">

                Personal Information

            </div>

            <lightning-layout multiple-rows>

                <lightning-layout-item
                    size="12"
                    medium-device-size="2"
                    large-device-size="2"
                    padding="around-small">

                    <lightning-combobox
                        label="Title"
                        value={passenger.title}
                        data-field="title"
                        options={titleOptions}
                        onchange={handleChange}>
                    </lightning-combobox>

                </lightning-layout-item>

                <lightning-layout-item
                    size="12"
                    medium-device-size="5"
                    large-device-size="5"
                    padding="around-small">

                    <lightning-input
                        label="First Name"
                        required
                        value={passenger.firstName}
                        data-field="firstName"
                        onchange={handleChange}>
                    </lightning-input>

                </lightning-layout-item>

                <lightning-layout-item
                    size="12"
                    medium-device-size="5"
                    large-device-size="5"
                    padding="around-small">

                    <lightning-input
                        label="Last Name"
                        required
                        value={passenger.lastName}
                        data-field="lastName"
                        onchange={handleChange}>
                    </lightning-input>

                </lightning-layout-item>

                <lightning-layout-item
                    size="12"
                    medium-device-size="6"
                    large-device-size="6"
                    padding="around-small">

                    <lightning-input
                        type="email"
                        label="Email"
                        required
                        value={passenger.email}
                        data-field="email"
                        onchange={handleChange}>
                    </lightning-input>

                </lightning-layout-item>

                <lightning-layout-item
                    size="12"
                    medium-device-size="6"
                    large-device-size="6"
                    padding="around-small">

                    <lightning-input
                        type="tel"
                        label="Phone"
                        value={passenger.phone}
                        data-field="phone"
                        onchange={handleChange}>
                    </lightning-input>

                </lightning-layout-item>

                <lightning-layout-item
                    size="12"
                    medium-device-size="4"
                    large-device-size="4"
                    padding="around-small">

                    <lightning-input
                        type="date"
                        label="Date of Birth"
                        required
                        value={passenger.dateOfBirth}
                        data-field="dateOfBirth"
                        onchange={handleChange}>
                    </lightning-input>

                </lightning-layout-item>

                <lightning-layout-item
                    size="12"
                    medium-device-size="4"
                    large-device-size="4"
                    padding="around-small">

                    <lightning-combobox
                        label="Gender"
                        value={passenger.gender}
                        data-field="gender"
                        options={genderOptions}
                        onchange={handleChange}>
                    </lightning-combobox>

                </lightning-layout-item>

                <lightning-layout-item
                    size="12"
                    medium-device-size="4"
                    large-device-size="4"
                    padding="around-small">

                    <lightning-combobox
                        label="Passenger Type"
                        value={passenger.passengerType}
                        data-field="passengerType"
                        options={passengerTypeOptions}
                        onchange={handleChange}>
                    </lightning-combobox>

                </lightning-layout-item>

            </lightning-layout>

        </div>

        <div class="divider"></div>

        <!-- Travel Information -->

        <div class="section">

            <div class="section-title">

                Travel Information

            </div>

            <lightning-layout multiple-rows>

                <lightning-layout-item
                    size="12"
                    medium-device-size="6"
                    large-device-size="6"
                    padding="around-small">

                    <lightning-input
                        label="Passport Number"
                        value={passenger.passportNumber}
                        data-field="passportNumber"
                        onchange={handleChange}>
                    </lightning-input>

                </lightning-layout-item>

                <lightning-layout-item
                    size="12"
                    medium-device-size="6"
                    large-device-size="6"
                    padding="around-small">

                    <lightning-combobox
                        label="Meal Preference"
                        value={passenger.mealPreference}
                        data-field="mealPreference"
                        options={mealOptions}
                        onchange={handleChange}>
                    </lightning-combobox>

                </lightning-layout-item>

            </lightning-layout>

        </div>

    </div>

</template>
