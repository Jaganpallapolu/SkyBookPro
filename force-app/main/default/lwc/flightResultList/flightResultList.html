<template>

    <div class="flight-results-container">

        <!-- Header -->

        <div class="flight-results-container">

            <!-- Header -->

            <div class="result-header">

                <div>

                    <h2>✈ Available Flights</h2>

                    <p>{showingText}</p>

                </div>

                <div class="page-indicator">

                    Page {pageNumber} of {totalPages}

                </div>

            </div>

            <!-- Filter Toolbar -->

            <div class="filter-toolbar">

                <lightning-layout multiple-rows vertical-align="end">

                    <!-- Airline -->

                    <lightning-layout-item size="12" medium-device-size="4" large-device-size="4"
                        padding="around-small">

                        <lightning-combobox label="Airline" value={selectedAirline} options={airlineOptions}
                            onchange={handleAirlineChange}>

                        </lightning-combobox>

                    </lightning-layout-item>

                    <!-- Cabin -->

                    <lightning-layout-item size="12" medium-device-size="4" large-device-size="4"
                        padding="around-small">

                        <lightning-combobox label="Cabin Class" value={selectedCabin} options={cabinOptions}
                            onchange={handleCabinChange}>

                        </lightning-combobox>

                    </lightning-layout-item>

                    <!-- Sort -->

                    <lightning-layout-item size="12" medium-device-size="4" large-device-size="4"
                        padding="around-small">

                        <lightning-combobox label="Sort By" value={selectedSort} options={sortOptions}
                            onchange={handleSortChange}>

                        </lightning-combobox>

                    </lightning-layout-item>

                </lightning-layout>

            </div>

        </div>

        <!-- Flight Cards -->

        <lightning-layout multiple-rows>

            <template for:each={visibleOffers} for:item="offer">

                <lightning-layout-item key={offer.offerId} size="12" medium-device-size="6" large-device-size="6"
                    padding="around-small">

                    <c-flight-result-card offer={offer} is-selected={offer.isSelected} onselect={handleFlightSelect}>
                    </c-flight-result-card>

                </lightning-layout-item>

            </template>

        </lightning-layout>

        <!-- Pagination -->

        <div class="pagination">

            <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={handlePrevious}
                disabled={disablePrevious}>
            </lightning-button>

            <div class="page-text">

                Page
                <strong>{pageNumber}</strong>
                of
                <strong>{totalPages}</strong>

            </div>

            <lightning-button label="Next" icon-name="utility:chevronright" icon-position="right" onclick={handleNext}
                disabled={disableNext}>
            </lightning-button>

        </div>

    </div>

</template>
