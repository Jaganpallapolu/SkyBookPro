<template>

    <section class="hero">

        <div class="hero-content">

            <!-- Left Section -->

            <div class="left">

                <div class="badge">
                    ✈ Trusted Flight Booking Platform
                </div>

                <h1>
                    Welcome to
                    <span>SkyBook Pro</span>
                </h1>

                <p class="description">

                    Book flights, manage reservations, track refunds,
                    and experience seamless travel management —
                    all from one intelligent platform.

                </p>

                <div class="button-group">

                    <lightning-button
                        variant="brand"
                        label="Book Your Flight"
                        onclick={scrollToSearch}>
                    </lightning-button>

                    <lightning-button
                        variant="neutral"
                        label="Explore"
                        onclick={scrollToDashboard}>
                    </lightning-button>

                </div>

            </div>

            <!-- Right Section -->

            <div class="right">

                <div class="stats-card">

                    <div class="stats-title">
                        SkyBook Statistics
                    </div>

                    <div class="stats-grid">

                        <div class="stat">

                            <div class="number">
                                50+
                            </div>

                            <div class="label">
                                Airlines
                            </div>

                        </div>

                        <div class="stat">

                            <div class="number">
                                1000+
                            </div>

                            <div class="label">
                                Routes
                            </div>

                        </div>

                        <div class="stat">

                            <div class="number">
                                24×7
                            </div>

                            <div class="label">
                                Support
                            </div>

                        </div>

                        <div class="stat">

                            <div class="number">
                                100%
                            </div>

                            <div class="label">
                                Secure
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- Features -->

        <div class="features">

            <div class="feature">

                <lightning-icon
                    icon-name="utility:success"
                    size="x-small">
                </lightning-icon>

                <span>
                    Instant Booking Confirmation
                </span>

            </div>

            <div class="feature">

                <lightning-icon
                    icon-name="utility:moneybag"
                    size="x-small">
                </lightning-icon>

                <span>
                    Fast Refund Processing
                </span>

            </div>

            <div class="feature">

                <lightning-icon
                    icon-name="utility:travel_and_places"
                    size="x-small">
                </lightning-icon>

                <span>
                    Global Flight Search
                </span>

            </div>

            <div class="feature">

                <lightning-icon
                    icon-name="utility:lock"
                    size="x-small">
                </lightning-icon>

                <span>
                    Secure Payment Experience
                </span>

            </div>

        </div>

    </section>

</template>
